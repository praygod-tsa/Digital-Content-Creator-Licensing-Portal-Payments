services:
  - type: web
    name: creator-portal-web
    runtime: python
    rootDir: creator-portal-pilot
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: creator-portal-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://creator-portal-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: creator-portal-db
          property: connectionString

databases:
  - name: creator-portal-db
    databaseName: creator_portal
    user: creator_portal_user
